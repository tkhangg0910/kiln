<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
    <style>
      .b{fill:#f6f8fa;stroke:#57606a;stroke-width:1.5}
      .k{fill:#fbefe9;stroke:#d27556;stroke-width:1.5}
      .t{fill:#1f2328;font-size:15px;font-weight:600;text-anchor:middle}
      .s{fill:#57606a;font-size:12.5px;text-anchor:middle}
      .l{fill:#57606a;font-size:12.5px;font-style:italic}
      .e{stroke:#57606a;stroke-width:1.5;fill:none;marker-end:url(#a)}
    </style>
  </defs>
  <rect width="900" height="360" rx="12" fill="#ffffff"/>

  <rect class="b" x="20" y="40" width="170" height="60" rx="8"/>
  <text class="t" x="105" y="66">Claude Code / Codex</text><text class="s" x="105" y="86">CLI, unchanged</text>

  <rect class="k" x="240" y="40" width="170" height="60" rx="8"/>
  <text class="t" x="325" y="66">kiln-pty</text><text class="s" x="325" y="86">Windows ConPTY</text>

  <rect class="k" x="460" y="40" width="170" height="60" rx="8"/>
  <text class="t" x="545" y="66">kiln-term</text><text class="s" x="545" y="86">terminal emulator</text>

  <rect class="k" x="690" y="40" width="190" height="60" rx="8"/>
  <text class="t" x="785" y="66">kiln-app</text><text class="s" x="785" y="86">main window, Settings</text>

  <rect class="b" x="20" y="170" width="170" height="60" rx="18"/>
  <text class="t" x="105" y="196">~/.claude, ~/.codex</text><text class="s" x="105" y="216">session transcripts</text>

  <rect class="b" x="20" y="270" width="170" height="60" rx="8"/>
  <text class="t" x="105" y="296">Status line relay</text><text class="s" x="105" y="316">kiln --statusline</text>

  <rect class="k" x="340" y="220" width="190" height="60" rx="8"/>
  <text class="t" x="435" y="246">kiln-core</text><text class="s" x="435" y="266">sessions, status, rules</text>

  <rect class="k" x="690" y="220" width="190" height="60" rx="8"/>
  <text class="t" x="785" y="246">kiln-island</text><text class="s" x="785" y="266">top-of-screen overlay</text>

  <path class="e" d="M190 70 H238"/>
  <path class="e" d="M410 70 H458"/>
  <path class="e" d="M630 70 H688"/>
  <path class="e" d="M190 200 L338 240"/>
  <text class="l" x="222" y="200">read only</text>
  <path class="e" d="M190 300 L338 262"/>
  <path class="e" d="M530 250 H688"/>
  <path class="e" d="M500 220 L715 102"/>
</svg>
