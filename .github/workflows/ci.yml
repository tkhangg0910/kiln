name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      # Actions are pinned to a commit, as a tag can be moved to other code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Rust comes with the runner image; no third-party toolchain action.
      - run: rustup update stable --no-self-update && rustup default stable && rustup component add clippy
      - run: cargo build --release
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
  linux:
    # Ubuntu 22.04: the oldest glibc Kilno's Linux build is meant to run on (PORTING-LINUX.md R5).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup update stable --no-self-update && rustup default stable && rustup component add clippy
      # Headers for winit's X11/Wayland back ends and the portal file dialog's D-Bus.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev libx11-dev libdbus-1-dev pkg-config
      - run: cargo build --release
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
