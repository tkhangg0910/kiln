# Pushing a v* tag builds the release zip on GitHub, attests where it was built, and puts the
# zip and its .sha256 on a draft release for that tag. Check the draft, write the notes, publish.
# Anyone can then check a download: gh attestation verify <zip> --repo tkhangg0910/kilno
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write       # the draft release
  id-token: write       # signing the attestation
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      # Actions are pinned to a commit, as a tag can be moved to other code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0              # main's history, for the check below
          persist-credentials: false

      # Only reviewed code ships: a tag pushed on any other branch builds nothing.
      - name: The tag is on main
        shell: pwsh
        run: |
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw "$env:GITHUB_REF_NAME is not on main" }

      - name: Rust toolchain
        shell: pwsh
        run: rustup update stable --no-self-update; rustup default stable

      - name: Tests
        shell: pwsh
        run: cargo test

      - name: Build the zip
        shell: pwsh
        run: ./scripts/publish.ps1

      - name: The tag matches the version
        shell: pwsh
        run: |
          $zip = Get-ChildItem publish/kilno-*-win-x64.zip
          if ($zip.Name -ne "kilno-$($env:GITHUB_REF_NAME.TrimStart('v'))-win-x64.zip") {
            throw "$($zip.Name) does not match the tag $env:GITHUB_REF_NAME"
          }

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: publish/kilno-*-win-x64.zip

      - name: Draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME --draft --verify-tag --title "Kilno $($env:GITHUB_REF_NAME.TrimStart('v'))" `
            (Get-ChildItem publish/kilno-*-win-x64.zip).FullName (Get-ChildItem publish/kilno-*-win-x64.zip.sha256).FullName

  # The Linux tar.gz, on the draft the Windows job made. Ubuntu 22.04: an old enough glibc
  # for the distributions Kilno supports (PORTING-LINUX.md R5).
  linux:
    needs: release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: The tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$GITHUB_REF_NAME is not on main"; exit 1; }

      - name: Rust toolchain and headers
        run: |
          rustup update stable --no-self-update && rustup default stable
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev libx11-dev libdbus-1-dev pkg-config

      - name: Tests
        run: cargo test

      - name: Build the tar.gz
        run: sh scripts/publish.sh

      - name: The tag matches the version
        run: test -f "publish/kilno-${GITHUB_REF_NAME#v}-linux-x64.tar.gz" || { ls publish; exit 1; }

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: publish/kilno-*-linux-x64.tar.gz

      - name: Add it to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" publish/kilno-*-linux-x64.tar.gz publish/kilno-*-linux-x64.tar.gz.sha256
